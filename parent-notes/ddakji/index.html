<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Fold and play ddakji, a traditional Korean paper game for families.">
  <title>A little folding, lots of play | Globee</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; background: #fffefa; color: #2d352f; font: 1rem/1.55 Manrope, system-ui, sans-serif; }
    body { margin: 0; }
    main { max-width: 56rem; margin-inline: auto; padding: 1.5rem clamp(1.125rem, 5vw, 3rem) 3rem; }
    a { color: #244a78; text-underline-offset: .2em; }
    a:focus-visible, summary:focus-visible { outline: 3px solid #244a78; outline-offset: 4px; }
    .back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
    .layout { display: grid; gap: 1.5rem; align-items: start; margin-top: 1rem; }
    .series { color: #354e3d; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font: 700 clamp(2.35rem, 6vw, 4.3rem)/1.02 Outfit, system-ui, sans-serif; letter-spacing: -.035em; margin: .65rem 0 1rem; }
    p { max-width: 36ch; margin: 0 0 .8rem; }
    .reel { width: 100%; max-width: 23rem; }
    .reel summary { cursor: pointer; font-weight: 700; color: #244a78; }
    .reel img { display: block; width: 100%; height: auto; margin-bottom: .75rem; border-radius: .25rem; }
    .reel details[open] img { display: none; }
    .reel iframe { display: block; width: 100%; aspect-ratio: 1 / 2.15; min-height: 30rem; margin-top: .75rem; border: 0; }
    .reel p { margin-top: .75rem; }
    @media (min-width: 44rem) {
      .layout { grid-template-columns: 1fr minmax(16rem, 22rem); gap: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/?section=notes#parent-notes-pending">← Parent notes</a>
    <div class="layout">
      <header>
        <p class="series">Globee Play</p>
        <h1>A little folding, lots of play.</h1>
        <p>Fold a pair of ddakji together, then take turns throwing one to flip the other. Old newspapers and leaflets work, too.</p>
      </header>
      <div class="reel">
        <details id="instagram-reel">
          <summary>
            <img src="cover.webp" width="540" height="475" alt="">
            Load the Instagram video
          </summary>
          <template id="instagram-player">
            <iframe src="https://www.instagram.com/reel/DfzZoZQo3f_/embed/" title="Globee’s original ddakji reel on Instagram" allowfullscreen></iframe>
          </template>
        </details>
        <p><a href="https://www.instagram.com/p/DfzZoZQo3f_/">Watch on Instagram</a></p>
      </div>
    </div>
  </main>
  <script>
    const reel = document.getElementById('instagram-reel');
    const player = document.getElementById('instagram-player');

    reel.addEventListener('toggle', () => {
      if (reel.open && !reel.querySelector('iframe')) {
        reel.append(player.content.cloneNode(true));
      }
    });
  </script>
</body>
</html>
